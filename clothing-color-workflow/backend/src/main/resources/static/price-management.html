<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统管理 - 模型价格</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="auth.js"></script>
    <script>
        if (window.AppAuth && !window.AppAuth.isAdmin()) window.location.replace('list.html');
    </script>
    <script src="js/sidebar.js"></script>
    <style>
        [v-cloak] { display: none; }
        .price-admin-card { max-width: 1440px; margin: 0 auto; }
        .price-admin-card .el-card__header { padding: 18px 22px; }
        .price-admin-card .el-card__body { padding: 20px 22px 24px; }
        .price-admin-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
        .price-admin-eyebrow { margin: 0 0 5px; color: var(--app-brand-primary); font-size: 12px; font-weight: 800; letter-spacing: .06em; }
        .price-admin-title { margin: 0; color: var(--app-text-primary); font-size: 20px; font-weight: 800; line-height: 1.35; }
        .price-admin-description { max-width: 720px; margin: 6px 0 0; color: var(--app-text-secondary); font-size: 13px; line-height: 1.65; }
        .price-admin-actions { display: flex; flex: 0 0 auto; align-items: center; justify-content: flex-end; gap: 8px; padding-top: 2px; }
        .price-admin-summary { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 12px; margin: 16px 0; }
        .price-admin-stat { min-width: 0; padding: 13px 15px; border: 1px solid var(--app-border-light); border-radius: 10px; background: var(--app-bg-elevated); }
        .price-admin-stat span { display: block; margin-bottom: 5px; color: var(--app-text-secondary); font-size: 12px; }
        .price-admin-stat strong { color: var(--app-text-primary); font-size: 16px; line-height: 1.3; }
        .price-admin-tabs { margin-top: 4px; }
        .price-admin-tabs .el-tabs__header { margin-bottom: 14px; }
        .price-admin-tabs .el-tabs__item { font-weight: 700; }
        .price-catalogue-hint { margin-top: 14px; }
        .price-model-family { display: grid; gap: 3px; min-width: 0; }
        .price-model-family strong { color: var(--app-text-primary); font-size: 13px; line-height: 1.35; }
        .price-model-family span { color: var(--app-text-secondary); font-size: 12px; line-height: 1.3; }
        .price-model-id { color: var(--app-text-secondary); font-family: Consolas, "SFMono-Regular", monospace; font-size: 12px; overflow-wrap: anywhere; }
        .price-name { color: var(--app-brand-primary); font-weight: 750; }
        .price-money { color: #1d4ed8; font-weight: 800; font-variant-numeric: tabular-nums; }
        .price-mode-empty { color: var(--app-text-muted); }
        .price-model-group-start td { border-top: 2px solid #c7d7f6 !important; }
        .price-rule-form .el-select-dropdown__item { max-width: 100%; }
        .price-rule-form .el-input-number { width: 100%; }
        .price-dialog-tip { margin: -2px 0 16px 92px; color: var(--app-text-secondary); font-size: 12px; line-height: 1.55; }
        .price-no-edit { margin-top: 14px; }
        @media (max-width: 760px) {
            .price-admin-card .el-card__header, .price-admin-card .el-card__body { padding-left: 16px; padding-right: 16px; }
            .price-admin-head { flex-direction: column; }
            .price-admin-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
            .price-admin-summary { grid-template-columns: 1fr; gap: 8px; }
            .price-dialog-tip { margin-left: 0; }
        }
    </style>
</head>
<body>
<div class="app-layout">
    <main class="app-main">
        <div id="priceApp" v-cloak>
            <el-card class="app-card price-admin-card" v-loading="loading">
                <template #header>
                    <div class="price-admin-head">
                        <div>
                            <p class="price-admin-eyebrow">系统管理 / 模型价格</p>
                            <h1 class="price-admin-title">模型价格管理</h1>
                            <p class="price-admin-description">统一维护图片和视频模型的当前计费规则。保存后仅影响后续提交任务的预估费用，历史任务保留提交时的价格。</p>
                        </div>
                        <div class="price-admin-actions">
                            <el-button @click="loadRules" :loading="loading">刷新</el-button>
                            <el-button type="primary" @click="openCreate" :disabled="!canEdit">新增价格规则</el-button>
                        </div>
                    </div>
                </template>

                <div class="price-admin-summary" aria-label="价格规则概览">
                    <div class="price-admin-stat"><span>积分换算</span><strong>1 积分 = ¥{{ creditToCny }}</strong></div>
                    <div class="price-admin-stat"><span>图片规则</span><strong>{{ imageRuleCount }} 条</strong></div>
                    <div class="price-admin-stat"><span>视频规则</span><strong>{{ videoRuleCount }} 条</strong></div>
                </div>

                <el-alert
                    title="当前仅维护一套生效价格；模型价格保存后会立即用于新任务费用预估。"
                    type="info"
                    :closable="false"
                    show-icon
                ></el-alert>
                <el-alert
                    class="price-catalogue-hint"
                    title="展示顺序按 KIE 模型目录：厂商 → 模型系列 → 规格 / 输入方式；相同系列的规则会连续显示。"
                    type="success"
                    :closable="false"
                    show-icon
                ></el-alert>
                <el-alert
                    v-if="!canEdit && !loading"
                    class="price-no-edit"
                    title="当前账号只有查看权限，价格规则仅限 PINKSIR 维护。"
                    type="warning"
                    :closable="false"
                    show-icon
                ></el-alert>

                <el-tabs v-model="activeMedia" class="price-admin-tabs">
                    <el-tab-pane :label="'图片模型（' + imageRuleCount + '）'" name="image">
                        <price-rule-table
                            :rules="filteredRules"
                            :can-edit="canEdit"
                            @edit="openEdit"
                            @remove="removeRule"
                        ></price-rule-table>
                    </el-tab-pane>
                    <el-tab-pane :label="'视频模型（' + videoRuleCount + '）'" name="video">
                        <price-rule-table
                            :rules="filteredRules"
                            :can-edit="canEdit"
                            @edit="openEdit"
                            @remove="removeRule"
                        ></price-rule-table>
                    </el-tab-pane>
                </el-tabs>
            </el-card>

            <el-dialog v-model="dialogVisible" :title="editingIndex === null ? '新增价格规则' : '编辑价格规则'" width="560px" :close-on-click-modal="false">
                <el-form ref="formRef" :model="form" :rules="formRules" label-width="92px" class="price-rule-form">
                    <el-form-item label="模型类型" prop="media_type">
                        <el-select v-model="form.media_type" style="width: 100%" @change="onFormMediaChange">
                            <el-option label="图片模型" value="image"></el-option>
                            <el-option label="视频模型" value="video"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="显示名称" prop="display_name">
                        <el-input v-model="form.display_name" placeholder="例如：GPT Image 2 · 4K"></el-input>
                    </el-form-item>
                    <el-form-item label="模型 ID" prop="model">
                        <el-select
                            v-model="form.model"
                            filterable
                            allow-create
                            default-first-option
                            placeholder="选择已接入模型，或输入新的模型 ID"
                            style="width: 100%"
                            @change="applyModelPreset"
                        >
                            <el-option-group v-for="group in selectableModelGroups" :key="group.label" :label="group.label">
                                <el-option v-for="option in group.options" :key="option.model" :label="option.label" :value="option.model">
                                    <span>{{ option.label }}</span>
                                    <span class="price-model-id" style="float: right; margin-left: 16px; max-width: 54%; text-align: right;">{{ option.model }}</span>
                                </el-option>
                            </el-option-group>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="规格">
                        <el-input v-model="form.resolution" placeholder="例如：2K、4K；无要求可留空"></el-input>
                    </el-form-item>
                    <el-form-item label="输入方式">
                        <el-input v-model="form.input_mode" placeholder="例如：image_to_image；无要求可留空"></el-input>
                    </el-form-item>
                    <el-form-item label="计费单位" prop="rate_unit">
                        <el-select v-model="form.rate_unit" style="width: 100%">
                            <el-option label="每张" value="PER_IMAGE"></el-option>
                            <el-option label="每任务" value="PER_TASK"></el-option>
                            <el-option label="每秒" value="PER_SECOND"></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="单价（元）" prop="unit_price_cny">
                        <el-input-number v-model="form.unit_price_cny" :min="0" :step="0.001" :precision="3" controls-position="right"></el-input-number>
                    </el-form-item>
                    <el-form-item label="优先级" prop="priority">
                        <el-input-number v-model="form.priority" :min="0" :step="1" :precision="0" controls-position="right"></el-input-number>
                    </el-form-item>
                </el-form>
                <p class="price-dialog-tip">优先级数值越大，匹配同一模型规则时越优先使用。</p>
                <template #footer>
                    <el-button @click="dialogVisible = false">取消</el-button>
                    <el-button type="primary" :loading="saving" @click="saveRule">保存</el-button>
                </template>
            </el-dialog>
        </div>
    </main>
</div>

<script>
    const { createApp, ref, reactive, computed, onMounted } = Vue;

    // 与 KIE 已接入模型的展示顺序保持一致；未知模型仍可作为手动规则保存，统一排在最后。
    const KIE_MODEL_CATALOGUE = [
        { model: 'nano-banana-pro', label: 'Nano Banana Pro', family: 'Nano Banana', vendor: 'Google', media: 'image', rank: 10 },
        { model: 'nano-banana-2', label: 'Nano Banana 2', family: 'Nano Banana', vendor: 'Google', media: 'image', rank: 20 },
        { model: 'gpt-image-2-image-to-image', label: 'GPT Image 2 · 图生图', family: 'GPT Image 2', vendor: 'OpenAI', media: 'image', rank: 30 },
        { model: 'gpt-image-2-5-sunburst-text-to-image', label: 'GPT Image 2.5 · 文生图', family: 'GPT Image 2.5', vendor: 'OpenAI', media: 'image', rank: 50 },
        { model: 'gpt-image-2-5-sunburst-image-to-image', label: 'GPT Image 2.5 · 图生图', family: 'GPT Image 2.5', vendor: 'OpenAI', media: 'image', rank: 51 },
        { model: 'bytedance/seedance-2-5', label: 'Seedance 2.5', family: 'Seedance 2.5', vendor: 'ByteDance', media: 'video', rank: 10 },
        { model: 'bytedance/seedance-2', label: 'Seedance 2', family: 'Seedance 2', vendor: 'ByteDance', media: 'video', rank: 20 },
        { model: 'bytedance/seedance-2-mini', label: 'Seedance 2 Mini', family: 'Seedance 2 Mini', vendor: 'ByteDance', media: 'video', rank: 30 },
        { model: 'minimax-h3/text-to-video', label: 'MiniMax H3 · 文生视频', family: 'MiniMax H3', vendor: 'MiniMax', media: 'video', rank: 40 },
        { model: 'minimax-h3/image-to-video', label: 'MiniMax H3 · 图生视频', family: 'MiniMax H3', vendor: 'MiniMax', media: 'video', rank: 41 },
        { model: 'minimax-h3/reference-to-video', label: 'MiniMax H3 · 参考生视频', family: 'MiniMax H3', vendor: 'MiniMax', media: 'video', rank: 42 },
        { model: 'minimax-h3/image-input', label: 'MiniMax H3 · 图片输入', family: 'MiniMax H3', vendor: 'MiniMax', media: 'video', rank: 43 },
        { model: 'kling-3.0/video', label: 'Kling 3.0', family: 'Kling 3.0', vendor: 'Kling', media: 'video', rank: 50 },
        { model: 'kling-3.0/motion-control', label: 'Kling 3.0 · Motion Control', family: 'Kling 3.0', vendor: 'Kling', media: 'video', rank: 51 },
        { model: 'kling/v3-turbo-image-to-video', label: 'Kling 3.0 · Turbo 图生视频', family: 'Kling 3.0', vendor: 'Kling', media: 'video', rank: 52 }
    ];

    const modelKey = value => String(value || '').trim().toLowerCase();
    const modelMeta = value => KIE_MODEL_CATALOGUE.find(item => item.model === modelKey(value)) || {
        model: String(value || '').trim(),
        label: String(value || '').trim() || '未命名模型',
        family: '其他手动规则',
        vendor: '其他',
        media: '',
        rank: 9999
    };
    const resolutionRank = value => ({
        '4k': 10, '2k': 20, '1k': 30,
        '1080p': 10, '768p': 20, '720p': 30, '480p': 40,
        'pro': 50, 'standard': 60
    })[modelKey(value)] ?? 90;
    const inputModeRank = value => ({
        'video': 10, 'image_input': 20, 'image-to-video': 30,
        'image_to_video': 30, 'reference_to_video': 40, 'text_to_video': 50,
        'audio': 60
    })[modelKey(value)] ?? 90;
    const compareKieCatalogue = (left, right) => {
        const a = modelMeta(left.model);
        const b = modelMeta(right.model);
        return a.rank - b.rank
            || a.vendor.localeCompare(b.vendor)
            || a.family.localeCompare(b.family)
            || resolutionRank(left.resolution) - resolutionRank(right.resolution)
            || inputModeRank(left.input_mode) - inputModeRank(right.input_mode)
            || Number(right.priority || 0) - Number(left.priority || 0)
            || Number(left.id || 0) - Number(right.id || 0);
    };

    const PriceRuleTable = {
        props: {
            rules: { type: Array, required: true },
            canEdit: { type: Boolean, default: false }
        },
        emits: ['edit', 'remove'],
        methods: {
            rateLabel(value) {
                return { PER_IMAGE: '每张', PER_TASK: '每任务', PER_SECOND: '每秒' }[value] || value || '—';
            },
            money(value) {
                return '¥' + Number(value || 0).toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
            },
            modelInfo(row) {
                return modelMeta(row.model);
            },
            rowClassName({ row, rowIndex }) {
                if (rowIndex === 0) return '';
                const previous = this.rules[rowIndex - 1];
                const currentInfo = modelMeta(row.model);
                const previousInfo = modelMeta(previous.model);
                return currentInfo.vendor !== previousInfo.vendor || currentInfo.family !== previousInfo.family
                    ? 'price-model-group-start'
                    : '';
            }
        },
        template: `
            <el-table :data="rules" :row-class-name="rowClassName" border stripe style="width: 100%; border-radius: 8px; overflow: hidden;" empty-text="暂无价格规则">
                <el-table-column type="index" label="序号" width="70" align="center"></el-table-column>
                <el-table-column label="厂商 / 模型系列" min-width="164">
                    <template #default="scope">
                        <div class="price-model-family">
                            <strong>{{ modelInfo(scope.row).family }}</strong>
                            <span>{{ modelInfo(scope.row).vendor }} · KIE</span>
                        </div>
                    </template>
                </el-table-column>
                <el-table-column label="计费规则" min-width="180">
                    <template #default="scope"><span class="price-name">{{ scope.row.display_name || scope.row.model }}</span></template>
                </el-table-column>
                <el-table-column prop="model" label="模型 ID" min-width="240">
                    <template #default="scope"><span class="price-model-id">{{ scope.row.model || '—' }}</span></template>
                </el-table-column>
                <el-table-column prop="resolution" label="规格" min-width="100" align="center">
                    <template #default="scope"><el-tag size="small" effect="plain">{{ scope.row.resolution || '默认' }}</el-tag></template>
                </el-table-column>
                <el-table-column prop="input_mode" label="输入方式" min-width="145">
                    <template #default="scope"><span :class="{ 'price-mode-empty': !scope.row.input_mode }">{{ scope.row.input_mode || '未限定' }}</span></template>
                </el-table-column>
                <el-table-column label="计费单位" width="105" align="center">
                    <template #default="scope"><el-tag size="small" type="info" effect="light">{{ rateLabel(scope.row.rate_unit) }}</el-tag></template>
                </el-table-column>
                <el-table-column label="单价（元）" width="115" align="right">
                    <template #default="scope"><span class="price-money">{{ money(scope.row.unit_price_cny) }}</span></template>
                </el-table-column>
                <el-table-column prop="priority" label="优先级" width="95" align="center"></el-table-column>
                <el-table-column v-if="canEdit" label="操作" width="156" align="center" fixed="right">
                    <template #default="scope">
                        <el-button size="small" type="primary" plain @click="$emit('edit', scope.row)">编辑</el-button>
                        <el-button size="small" type="danger" plain @click="$emit('remove', scope.row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
        `
    };

    createApp({
        components: { PriceRuleTable },
        setup() {
            const loading = ref(false);
            const saving = ref(false);
            const rules = ref([]);
            const catalogue = ref(null);
            const canEdit = ref(false);
            const activeMedia = ref('image');
            const dialogVisible = ref(false);
            const editingIndex = ref(null);
            const formRef = ref(null);
            const form = reactive({ provider: 'kie', media_type: 'image', model: '', resolution: '', input_mode: '', rate_unit: 'PER_IMAGE', unit_price_cny: 0, base_price_cny: 0, priority: 10, active: true, display_name: '' });
            const formRules = {
                media_type: [{ required: true, message: '请选择模型类型', trigger: 'change' }],
                display_name: [{ required: true, message: '请填写显示名称', trigger: 'blur' }],
                model: [{ required: true, message: '请填写模型 ID', trigger: 'blur' }],
                rate_unit: [{ required: true, message: '请选择计费单位', trigger: 'change' }]
            };

            const imageRuleCount = computed(() => rules.value.filter(rule => String(rule.media_type).toLowerCase() === 'image').length);
            const videoRuleCount = computed(() => rules.value.filter(rule => String(rule.media_type).toLowerCase() === 'video').length);
            const filteredRules = computed(() => rules.value
                .filter(rule => String(rule.media_type).toLowerCase() === activeMedia.value)
                .slice()
                .sort(compareKieCatalogue));
            const creditToCny = computed(() => Number(catalogue.value?.credit_to_cny ?? catalogue.value?.creditToCny ?? 0.032).toFixed(3));
            const selectableModelGroups = computed(() => {
                const groups = [];
                KIE_MODEL_CATALOGUE
                    .filter(item => item.media === form.media_type)
                    .forEach(item => {
                        const groupLabel = `${item.vendor} · ${item.family}`;
                        let group = groups.find(candidate => candidate.label === groupLabel);
                        if (!group) {
                            group = { label: groupLabel, options: [] };
                            groups.push(group);
                        }
                        group.options.push(item);
                    });
                return groups;
            });

            const cloneRule = rule => Object.assign({}, rule);
            const normaliseRule = rule => ({
                provider: String(rule.provider || 'kie').trim(),
                media_type: String(rule.media_type || '').trim(),
                model: String(rule.model || '').trim(),
                resolution: String(rule.resolution || '').trim(),
                input_mode: String(rule.input_mode || '').trim(),
                rate_unit: String(rule.rate_unit || 'PER_IMAGE').trim(),
                unit_price_cny: Number(rule.unit_price_cny || 0),
                base_price_cny: Number(rule.base_price_cny || 0),
                priority: Number(rule.priority || 0),
                active: rule.active !== false,
                display_name: String(rule.display_name || '').trim()
            });

            const loadRules = async () => {
                loading.value = true;
                try {
                    const response = await axios.get('/api/admin/model-prices');
                    catalogue.value = response.data.catalogue || null;
                    rules.value = Array.isArray(response.data.rules) ? response.data.rules.map(cloneRule) : [];
                    canEdit.value = Boolean(response.data.can_edit);
                } catch (error) {
                    ElementPlus.ElMessage.error('无法获取模型价格，请刷新后重试。');
                } finally {
                    loading.value = false;
                }
            };

            const resetForm = () => {
                Object.assign(form, { provider: 'kie', media_type: activeMedia.value, model: '', resolution: '', input_mode: '', rate_unit: activeMedia.value === 'video' ? 'PER_SECOND' : 'PER_IMAGE', unit_price_cny: 0, base_price_cny: 0, priority: 10, active: true, display_name: '' });
            };
            const openCreate = () => {
                if (!canEdit.value) return;
                editingIndex.value = null;
                resetForm();
                dialogVisible.value = true;
            };
            const openEdit = rule => {
                const index = rules.value.indexOf(rule);
                if (!canEdit.value || index < 0) return;
                editingIndex.value = index;
                Object.assign(form, cloneRule(rule));
                dialogVisible.value = true;
            };
            const onFormMediaChange = () => {
                const selected = modelMeta(form.model);
                if (selected.media && selected.media !== form.media_type) {
                    form.model = '';
                    form.display_name = '';
                }
            };
            const applyModelPreset = value => {
                const selected = modelMeta(value);
                if (!selected.media) return;
                if (!form.display_name || editingIndex.value === null) form.display_name = selected.label;
            };
            const persistRules = async (nextRules, successMessage) => {
                saving.value = true;
                try {
                    const response = await axios.put('/api/admin/model-prices/rules', { rules: nextRules.map(normaliseRule) });
                    rules.value = Array.isArray(response.data.rules) ? response.data.rules.map(cloneRule) : nextRules.map(cloneRule);
                    ElementPlus.ElMessage.success(successMessage);
                    return true;
                } catch (error) {
                    ElementPlus.ElMessage.error(error?.response?.data?.message || '保存失败，请稍后重试。');
                    return false;
                } finally {
                    saving.value = false;
                }
            };
            const saveRule = async () => {
                if (!formRef.value) return;
                const valid = await formRef.value.validate().catch(() => false);
                if (!valid) return;
                const next = rules.value.map(cloneRule);
                if (editingIndex.value === null) next.push(normaliseRule(form));
                else next.splice(editingIndex.value, 1, normaliseRule(form));
                const success = await persistRules(next, editingIndex.value === null ? '价格规则已新增。' : '价格规则已更新。');
                if (success) dialogVisible.value = false;
            };
            const removeRule = async rule => {
                if (!canEdit.value) return;
                try {
                    await ElementPlus.ElMessageBox.confirm(`确定删除价格规则“${rule.display_name || rule.model}”吗？`, '删除价格规则', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消' });
                    const next = rules.value.filter(item => item !== rule).map(cloneRule);
                    await persistRules(next, '价格规则已删除。');
                } catch (error) {
                    // 用户取消时无需提示；请求失败会由 persistRules 给出提示。
                }
            };

            onMounted(loadRules);
            return { loading, saving, canEdit, activeMedia, dialogVisible, editingIndex, formRef, form, formRules, filteredRules, imageRuleCount, videoRuleCount, creditToCny, selectableModelGroups, loadRules, openCreate, openEdit, onFormMediaChange, applyModelPreset, saveRule, removeRule };
        }
    }).use(ElementPlus).mount('#priceApp');
</script>
</body>
</html>
