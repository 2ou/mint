<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>A+ 历史记录 - AI 时尚视觉平台</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/shared.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"/>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="auth.js"></script>
    <script src="js/sidebar.js"></script>
    <style>
        :root {
            --page-bg: #f5f7fb;
            --surface: #ffffff;
            --surface-soft: #f9fafb;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --muted-soft: #9ca3af;
            --primary: #2563eb;
            --primary-soft: #eff6ff;
            --radius: 8px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--app-font-family);
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 34%),
                linear-gradient(180deg, #f8fafc 0%, var(--page-bg) 100%);
            color: var(--text);
            letter-spacing: 0;
        }

        .app-main {
            padding: 0;
            background: var(--page-bg);
            min-height: 100vh;
        }

        .page-shell {
            padding: 24px 28px 32px;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        .page-title {
            margin: 0;
            font-size: 22px;
            line-height: 1.3;
            font-weight: 700;
            color: var(--text);
        }

        .page-subtitle {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.84);
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: var(--radius);
            padding: 14px 16px;
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.06);
            backdrop-filter: blur(10px);
        }

        .summary-label {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }

        .summary-value {
            margin-top: 6px;
            color: var(--text);
            font-size: 24px;
            line-height: 1;
            font-weight: 750;
        }

        .summary-hint {
            margin-top: 6px;
            color: var(--muted-soft);
            font-size: 12px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
            overflow: hidden;
        }

        .panel + .panel {
            margin-top: 16px;
        }

        .panel-body {
            padding: 16px;
        }

        .filters {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .project-name-cell {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .project-name-main {
            color: var(--text);
            font-weight: 650;
        }

        .project-name-sub {
            color: var(--muted);
            font-size: 12px;
        }

        .detail-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        .detail-title {
            margin: 0;
            font-size: 18px;
            line-height: 1.35;
            font-weight: 700;
            color: var(--text);
            word-break: break-word;
        }

        .detail-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
        }

        .section {
            padding: 16px 0;
            border-top: 1px solid var(--border);
        }

        .section-title {
            margin: 0 0 12px;
            font-size: 13px;
            font-weight: 650;
            color: var(--text);
        }

        .text-block {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13px;
            line-height: 1.7;
            color: #374151;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
        }

        .image-strip {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .image-tile {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface-soft);
            overflow: hidden;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .image-label {
            width: 100%;
            padding: 8px 10px;
            font-size: 12px;
            color: #6b7280;
            border-bottom: 1px solid var(--border);
            background: #ffffff;
        }

        .image-tile .el-image {
            width: 100%;
            height: 220px;
            display: block;
        }

        .task-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .task-card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            overflow: hidden;
            transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
        }

        .task-card:hover {
            transform: translateY(-1px);
            border-color: #bfdbfe;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }

        .task-preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--surface-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }

        .task-preview .el-image {
            width: 100%;
            height: 100%;
            display: block;
        }

        .task-body {
            padding: 12px;
        }

        .task-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 13px;
            font-weight: 650;
            color: var(--text);
        }

        .task-subtitle {
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
        }

        .task-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pagination-wrap {
            display: flex;
            justify-content: center;
            padding-top: 16px;
        }

        .drawer-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .empty-task {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            background: var(--surface-soft);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
        }

        @media (max-width: 860px) {
            .page-shell {
                padding: 18px 14px 24px;
            }

            .summary-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .page-header,
            .detail-header {
                flex-direction: column;
            }

            .toolbar,
            .drawer-actions {
                width: 100%;
                justify-content: flex-start;
            }
        }

        @media (max-width: 560px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="app-layout">
        <main class="app-main">
            <div class="page-shell">
                <header class="page-header">
                    <div>
                        <h1 class="page-title">A+ 历史记录</h1>
                        <p class="page-subtitle">查看项目进度、下载结果、重试失败模块，并把成熟配置保存为可复用模板。</p>
                    </div>
                    <div class="toolbar">
                        <el-button @click="loadProjects" :loading="loading">刷新</el-button>
                        <el-button type="primary" @click="goToCreate">创建 A+ 项目</el-button>
                    </div>
                </header>

                <div class="summary-grid">
                    <div class="summary-card">
                        <div class="summary-label">项目总数</div>
                        <div class="summary-value">{{ totalProjects }}</div>
                        <div class="summary-hint">当前筛选条件下</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-label">已完成</div>
                        <div class="summary-value">{{ completedProjectCount }}</div>
                        <div class="summary-hint">可直接下载 ZIP</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-label">生成中</div>
                        <div class="summary-value">{{ runningProjectCount }}</div>
                        <div class="summary-hint">文案或图片处理中</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-label">异常项目</div>
                        <div class="summary-value">{{ failedProjectCount }}</div>
                        <div class="summary-hint">可进入详情重试</div>
                    </div>
                </div>

                <section class="panel">
                    <div class="panel-body">
                        <div class="filters">
                            <el-input
                                v-model="searchSpu"
                                placeholder="搜索 SPU"
                                clearable
                                style="width: 220px;"
                                @clear="resetAndLoad"
                                @keyup.enter="resetAndLoad"/>
                            <el-select
                                v-model="searchStatus"
                                placeholder="状态"
                                clearable
                                style="width: 190px;"
                                @change="resetAndLoad">
                                <el-option label="已创建" value="CREATED"/>
                                <el-option label="生成文案中" value="GENERATING_COPY"/>
                                <el-option label="文案待确认" value="COPY_DONE"/>
                                <el-option label="生成图片中" value="GENERATING_IMAGES"/>
                                <el-option label="已完成" value="COMPLETED"/>
                                <el-option label="部分失败" value="PARTIAL_FAILED"/>
                                <el-option label="失败" value="FAILED"/>
                            </el-select>
                            <el-button type="primary" @click="resetAndLoad">搜索</el-button>
                            <el-button @click="clearFilters">重置</el-button>
                        </div>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-body">
                        <el-table :data="projects" style="width: 100%" v-loading="loading" stripe highlight-current-row @row-click="row => viewDetail(row.id)">
                            <el-table-column prop="id" label="ID" width="72"/>
                            <el-table-column label="项目" min-width="220" show-overflow-tooltip>
                                <template #default="{ row }">
                                    <div class="project-name-cell">
                                        <span class="project-name-main">{{ row.projectName || '-' }}</span>
                                        <span class="project-name-sub">点击查看详情</span>
                                    </div>
                                </template>
                            </el-table-column>
                            <el-table-column prop="spu" label="SPU" width="130" show-overflow-tooltip/>
                            <el-table-column label="模板" min-width="150" show-overflow-tooltip>
                                <template #default="{ row }">
                                    <span>{{ row.layoutTemplateName || '-' }}</span>
                                </template>
                            </el-table-column>
                            <el-table-column label="状态" width="150">
                                <template #default="{ row }">
                                    <el-tag :type="statusType(row.status)" size="small">{{ statusLabel(row.status) }}</el-tag>
                                </template>
                            </el-table-column>
                            <el-table-column prop="operator" label="操作人" width="110"/>
                            <el-table-column prop="createdAt" label="创建时间" width="170"/>
                            <el-table-column prop="completedAt" label="完成时间" width="170"/>
                            <el-table-column label="操作" width="330" fixed="right">
                                <template #default="{ row }">
                                    <el-button size="small" @click.stop="viewDetail(row.id)">详情</el-button>
                                    <el-button size="small" @click.stop="downloadZip(row)" :disabled="!canDownload(row)">ZIP</el-button>
                                    <el-button size="small" @click.stop="saveAsTemplate(row)">存模板</el-button>
                                    <el-button size="small" type="danger" plain @click.stop="deleteProject(row.id)">删除</el-button>
                                </template>
                            </el-table-column>
                        </el-table>

                        <div class="pagination-wrap">
                            <el-pagination
                                v-model:current-page="currentPage"
                                v-model:page-size="pageSize"
                                :page-sizes="[10, 20, 50]"
                                :total="totalProjects"
                                layout="total, sizes, prev, pager, next, jumper"
                                @size-change="loadProjects"
                                @current-change="loadProjects"/>
                        </div>
                    </div>
                </section>

                <el-drawer v-model="showDetail" title="项目详情" size="72%" :destroy-on-close="true" @closed="stopPolling">
                    <template v-if="detailProject">
                        <div class="detail-header">
                            <div>
                                <h2 class="detail-title">
                                    {{ detailProject.projectName }}
                                    <el-tag :type="statusType(detailProject.status)" size="small" style="margin-left: 8px;">
                                        {{ statusLabel(detailProject.status) }}
                                    </el-tag>
                                </h2>
                                <div class="detail-meta">
                                    <span>SPU: {{ detailProject.spu || '-' }}</span>
                                    <span>创建：{{ detailProject.createdAt || '-' }}</span>
                                    <span v-if="detailProject.completedAt">完成：{{ detailProject.completedAt }}</span>
                                    <span v-if="detailProject.layoutTemplateName">模板：{{ detailProject.layoutTemplateName }}</span>
                                </div>
                            </div>
                            <div class="drawer-actions">
                                <el-button size="small" @click="refreshDetail" :loading="refreshing">刷新</el-button>
                                <el-button
                                    v-if="detailProject.status === 'COPY_DONE'"
                                    size="small"
                                    type="primary"
                                    @click="generateImages">
                                    生成图片
                                </el-button>
                                <el-button
                                    v-if="detailProject.status === 'PARTIAL_FAILED'"
                                    size="small"
                                    type="warning"
                                    @click="retryFailedModules">
                                    重试失败
                                </el-button>
                                <el-button size="small" type="primary" @click="downloadZip(detailProject)" :disabled="!hasSuccessTasks">
                                    下载 ZIP
                                </el-button>
                            </div>
                        </div>

                        <div class="section" v-if="detailProject.sellingPoints">
                            <h3 class="section-title">产品卖点</h3>
                            <div class="text-block">{{ detailProject.sellingPoints }}</div>
                        </div>

                        <div class="section" v-if="detailProject.referenceImageUrl || detailProject.layoutReferenceImageUrl">
                            <h3 class="section-title">参考图</h3>
                            <div class="image-strip">
                                <div class="image-tile" v-if="detailProject.referenceImageUrl">
                                    <div class="image-label">A+参考图</div>
                                    <el-image
                                        :src="detailProject.referenceImageUrl"
                                        fit="contain"
                                        :preview-src-list="[detailProject.referenceImageUrl]"
                                        preview-teleported/>
                                </div>
                                <div class="image-tile" v-if="detailProject.layoutReferenceImageUrl">
                                    <div class="image-label">结构参考图</div>
                                    <el-image
                                        :src="detailProject.layoutReferenceImageUrl"
                                        fit="contain"
                                        :preview-src-list="[detailProject.layoutReferenceImageUrl]"
                                        preview-teleported/>
                                </div>
                            </div>
                        </div>

                        <div class="section">
                            <h3 class="section-title">图片任务</h3>
                            <div v-if="!detailProject.imageTasks || detailProject.imageTasks.length === 0" class="empty-task">
                                暂无图片任务。
                            </div>
                            <div v-else class="task-grid">
                                <article class="task-card" v-for="task in detailProject.imageTasks" :key="task.id">
                                    <div class="task-preview">
                                        <el-image
                                            v-if="task.status === 'SUCCESS' && taskResultUrl(task)"
                                            :src="taskResultUrl(task)"
                                            fit="cover"
                                            :preview-src-list="[taskResultUrl(task)]"
                                            preview-teleported/>
                                        <span v-else>{{ taskStatusLabel(task.status) }}</span>
                                    </div>
                                    <div class="task-body">
                                        <div class="task-title-row">
                                            <div>
                                                <div class="task-title">{{ task.moduleCode }}</div>
                                                <div class="task-subtitle">{{ displayModuleName(task.moduleCode, task.moduleName) }}</div>
                                            </div>
                                            <el-tag :type="taskStatusType(task.status)" size="small">
                                                {{ taskStatusLabel(task.status) }}
                                            </el-tag>
                                        </div>
                                        <div v-if="task.errorMessage" class="text-block" style="margin-bottom: 10px;">
                                            {{ task.errorMessage }}
                                        </div>
                                        <div class="task-actions">
                                            <el-button v-if="task.status === 'SUCCESS'" size="small" @click="downloadSingle(task)">下载</el-button>
                                            <el-button v-if="task.status === 'SUCCESS' || task.status === 'FAILED'" size="small" @click="regenerateModule(task.moduleCode)">重新生成</el-button>
                                        </div>
                                    </div>
                                </article>
                            </div>
                        </div>

                        <div class="section" v-if="detailProject.aplusMarkdown">
                            <h3 class="section-title">A+ 文案</h3>
                            <div class="text-block" style="max-height: 420px; overflow: auto;">{{ detailProject.aplusMarkdown }}</div>
                        </div>
                    </template>
                </el-drawer>

                <el-dialog v-model="showSaveDialog" title="保存为模板" width="420px" :close-on-click-modal="false">
                    <el-form label-width="110px">
                        <el-form-item label="模板名称" required>
                            <el-input v-model="saveTemplateName" placeholder="请输入模板名称"/>
                        </el-form-item>
                    </el-form>
                    <template #footer>
                        <el-button @click="showSaveDialog = false">取消</el-button>
                        <el-button
                            type="primary"
                            @click="confirmSaveTemplate"
                            :loading="savingTemplate"
                            :disabled="!saveTemplateName.trim()">
                            保存
                        </el-button>
                    </template>
                </el-dialog>
            </div>
        </main>
    </div>
</div>

<script>
    const icons = ElementPlusIconsVue;
    const { createApp, ref, computed } = Vue;

    const app = createApp({
        setup() {
            const moduleNames = {
                'AD-01': '品牌首图',
                'AD-02': '面料故事',
                'AD-03': '设计细节',
                'AD-04': '多场景穿搭',
                'AD-05': '舒适体验',
                'AD-06': '尺码指南',
                'AD-07': '护理收尾'
            };

            const loading = ref(false);
            const projects = ref([]);
            const currentPage = ref(1);
            const pageSize = ref(20);
            const totalProjects = ref(0);
            const searchSpu = ref('');
            const searchStatus = ref('');

            const showDetail = ref(false);
            const detailProject = ref(null);
            const refreshing = ref(false);
            let pollTimer = null;

            const showSaveDialog = ref(false);
            const saveTemplateName = ref('');
            const savingTemplate = ref(false);
            const saveTemplateSource = ref(null);

            const isTerminalStatus = (status) => {
                return ['COMPLETED', 'PARTIAL_FAILED', 'FAILED'].includes(status);
            };

            const completedProjectCount = computed(() => {
                return projects.value.filter((project) => project.status === 'COMPLETED').length;
            });

            const runningProjectCount = computed(() => {
                return projects.value.filter((project) => ['CREATED', 'GENERATING_COPY', 'COPY_DONE', 'GENERATING_IMAGES'].includes(project.status)).length;
            });

            const failedProjectCount = computed(() => {
                return projects.value.filter((project) => ['PARTIAL_FAILED', 'FAILED'].includes(project.status)).length;
            });

            const loadProjects = async () => {
                loading.value = true;
                try {
                    const params = {
                        page: currentPage.value,
                        size: pageSize.value
                    };
                    if (searchSpu.value.trim()) params.spu = searchSpu.value.trim();
                    if (searchStatus.value) params.status = searchStatus.value;
                    const response = await axios.get('/api/aplus/projects', { params });
                    if (response.data && response.data.success) {
                        projects.value = response.data.data.content || [];
                        totalProjects.value = response.data.data.totalElements || 0;
                    } else {
                        ElementPlus.ElMessage.error((response.data && response.data.message) || '加载项目失败');
                    }
                } catch (e) {
                    ElementPlus.ElMessage.error('加载项目失败');
                } finally {
                    loading.value = false;
                }
            };

            const resetAndLoad = () => {
                currentPage.value = 1;
                loadProjects();
            };

            const clearFilters = () => {
                searchSpu.value = '';
                searchStatus.value = '';
                resetAndLoad();
            };

            const viewDetail = async (id) => {
                try {
                    const response = await axios.get(`/api/aplus/projects/${id}`);
                    if (response.data && response.data.success) {
                        detailProject.value = response.data.data;
                        showDetail.value = true;
                        if (!isTerminalStatus(detailProject.value.status)) startPolling();
                    } else {
                        ElementPlus.ElMessage.error((response.data && response.data.message) || '加载详情失败');
                    }
                } catch (e) {
                    ElementPlus.ElMessage.error('加载详情失败');
                }
            };

            const refreshDetail = async () => {
                if (!detailProject.value) return;
                refreshing.value = true;
                try {
                    const response = await axios.get(`/api/aplus/projects/${detailProject.value.id}`);
                    if (response.data && response.data.success) {
                        detailProject.value = response.data.data;
                    }
                } catch (e) {
                    ElementPlus.ElMessage.error('刷新失败');
                } finally {
                    refreshing.value = false;
                }
            };

            const startPolling = () => {
                stopPolling();
                pollTimer = setInterval(async () => {
                    if (!detailProject.value) return;
                    try {
                        const response = await axios.get(`/api/aplus/projects/${detailProject.value.id}`);
                        if (response.data && response.data.success) {
                            detailProject.value = response.data.data;
                            if (isTerminalStatus(detailProject.value.status)) {
                                stopPolling();
                                if (detailProject.value.status === 'COMPLETED') {
                                    ElementPlus.ElMessage.success('生成完成');
                                }
                            }
                        }
                    } catch (e) {
                        // Keep polling tolerant of temporary network errors.
                    }
                }, 5000);
            };

            const stopPolling = () => {
                if (pollTimer) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                }
            };

            const hasSuccessTasks = computed(() => {
                if (!detailProject.value || !Array.isArray(detailProject.value.imageTasks)) return false;
                return detailProject.value.imageTasks.some((task) => task.status === 'SUCCESS');
            });

            const taskResultUrl = (task) => task.resultOssUrl || task.resultTempUrl || '';

            const canDownload = (project) => {
                return ['COMPLETED', 'PARTIAL_FAILED'].includes(project.status);
            };

            const downloadSingle = (task) => {
                const url = taskResultUrl(task);
                if (!url) return;
                window.open(`/api/aplus/proxy-download?url=${encodeURIComponent(url)}&filename=${task.moduleCode}.jpg`);
            };

            const downloadZip = async (project) => {
                try {
                    const response = await axios.post(`/api/aplus/projects/${project.id}/download-zip`, {}, { responseType: 'blob' });
                    const url = window.URL.createObjectURL(new Blob([response.data]));
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `Aplus_${project.projectName || project.id}.zip`;
                    link.click();
                    window.URL.revokeObjectURL(url);
                } catch (e) {
                    ElementPlus.ElMessage.error('下载失败');
                }
            };

            const generateImages = async () => {
                if (!detailProject.value) return;
                try {
                    const response = await axios.post(`/api/aplus/projects/${detailProject.value.id}/generate-images`);
                    if (response.data && response.data.success) {
                        ElementPlus.ElMessage.success('图片生成任务已提交');
                        await refreshDetail();
                        startPolling();
                    } else {
                        ElementPlus.ElMessage.error((response.data && response.data.message) || '提交失败');
                    }
                } catch (e) {
                    ElementPlus.ElMessage.error('提交失败');
                }
            };

            const retryFailedModules = async () => {
                if (!detailProject.value) return;
                try {
                    const response = await axios.post(`/api/aplus/projects/${detailProject.value.id}/retry-failed`);
                    if (response.data && response.data.success) {
                        ElementPlus.ElMessage.success('重试任务已提交');
                        await refreshDetail();
                        startPolling();
                    } else {
                        ElementPlus.ElMessage.error((response.data && response.data.message) || '提交失败');
                    }
                } catch (e) {
                    ElementPlus.ElMessage.error('提交失败');
                }
            };

            const regenerateModule = async (moduleCode) => {
                if (!detailProject.value) return;
                try {
                    const response = await axios.post(`/api/aplus/projects/${detailProject.value.id}/modules/${moduleCode}/regenerate`);
                    if (response.data && response.data.success) {
                        ElementPlus.ElMessage.success(`${moduleCode} 已提交重新生成`);
                        await refreshDetail();
                        startPolling();
                    } else {
                        ElementPlus.ElMessage.error((response.data && response.data.message) || '提交失败');
                    }
                } catch (e) {
                    ElementPlus.ElMessage.error('提交失败');
                }
            };

            const deleteProject = async (id) => {
                try {
                    await ElementPlus.ElMessageBox.confirm(
                        '确认删除这个项目？该操作不可恢复。',
                        '确认删除',
                        {
                            confirmButtonText: '删除',
                            cancelButtonText: '取消',
                            type: 'warning'
                        }
                    );
                    const response = await axios.delete(`/api/aplus/projects/${id}`);
                    if (response.data && response.data.success) {
                        ElementPlus.ElMessage.success('项目已删除');
                        if (detailProject.value && detailProject.value.id === id) {
                            showDetail.value = false;
                            detailProject.value = null;
                            stopPolling();
                        }
                        await loadProjects();
                    } else {
                        ElementPlus.ElMessage.error((response.data && response.data.message) || '删除失败');
                    }
                } catch (e) {
                    if (e !== 'cancel' && e !== 'close') {
                        ElementPlus.ElMessage.error('删除失败');
                    }
                }
            };

            const saveAsTemplate = (project) => {
                saveTemplateSource.value = project;
                saveTemplateName.value = project.projectName || '';
                showSaveDialog.value = true;
            };

            const parseSelectedModules = (value) => {
                if (Array.isArray(value)) return value;
                try {
                    const parsed = JSON.parse(value || '[]');
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    return [];
                }
            };

            const confirmSaveTemplate = async () => {
                if (!saveTemplateName.value.trim() || !saveTemplateSource.value) return;
                savingTemplate.value = true;
                try {
                    const detailResponse = await axios.get(`/api/aplus/projects/${saveTemplateSource.value.id}`);
                    if (!detailResponse.data || !detailResponse.data.success) {
                        throw new Error('加载项目详情失败');
                    }
                    const project = detailResponse.data.data;
                    const moduleExtras = {};
                    if (Array.isArray(project.imageTasks)) {
                        for (const task of project.imageTasks) {
                            if (task.supplementaryImageUrl || task.supplementaryText) {
                                moduleExtras[task.moduleCode] = {
                                    supplementaryImageUrl: task.supplementaryImageUrl,
                                    supplementaryText: task.supplementaryText
                                };
                            }
                        }
                    }

                    const templateResponse = await axios.post('/api/aplus/templates', {
                        templateName: saveTemplateName.value.trim(),
                        spu: project.spu,
                        referenceImageUrl: project.referenceImageUrl,
                        sellingPoints: project.sellingPoints,
                        selectedModules: parseSelectedModules(project.selectedModules || project.selectedModuleList),
                        moduleExtras: moduleExtras
                    });

                    if (templateResponse.data && templateResponse.data.success) {
                        ElementPlus.ElMessage.success('模板已保存');
                        showSaveDialog.value = false;
                    } else {
                        ElementPlus.ElMessage.error((templateResponse.data && templateResponse.data.message) || '保存失败');
                    }
                } catch (e) {
                    ElementPlus.ElMessage.error('保存失败：' + (e.message || '未知错误'));
                } finally {
                    savingTemplate.value = false;
                }
            };

            const statusType = (status) => ({
                CREATED: 'info',
                GENERATING_COPY: 'warning',
                COPY_DONE: 'info',
                GENERATING_IMAGES: 'warning',
                COMPLETED: 'success',
                PARTIAL_FAILED: 'danger',
                FAILED: 'danger'
            }[status] || 'info');

            const statusLabel = (status) => ({
                CREATED: '已创建',
                GENERATING_COPY: '生成文案中',
                COPY_DONE: '文案待确认',
                GENERATING_IMAGES: '生成图片中',
                COMPLETED: '已完成',
                PARTIAL_FAILED: '部分失败',
                FAILED: '失败'
            }[status] || status || '-');

            const taskStatusType = (status) => ({
                PENDING: 'info',
                PROCESSING: 'warning',
                SUCCESS: 'success',
                FAILED: 'danger'
            }[status] || 'info');

            const taskStatusLabel = (status) => ({
                PENDING: '待生成',
                PROCESSING: '生成中',
                SUCCESS: '成功',
                FAILED: '失败'
            }[status] || status || '-');

            const displayModuleName = (moduleCode, fallback) => {
                return moduleNames[moduleCode] || fallback || '-';
            };

            const goToCreate = () => {
                window.location.href = 'aplus.html';
            };

            loadProjects();

            return {
                loading,
                moduleNames,
                projects,
                currentPage,
                pageSize,
                totalProjects,
                searchSpu,
                searchStatus,
                showDetail,
                detailProject,
                refreshing,
                showSaveDialog,
                saveTemplateName,
                savingTemplate,
                completedProjectCount,
                runningProjectCount,
                failedProjectCount,
                hasSuccessTasks,
                loadProjects,
                resetAndLoad,
                clearFilters,
                viewDetail,
                refreshDetail,
                stopPolling,
                taskResultUrl,
                canDownload,
                downloadSingle,
                downloadZip,
                generateImages,
                retryFailedModules,
                regenerateModule,
                deleteProject,
                saveAsTemplate,
                confirmSaveTemplate,
                statusType,
                statusLabel,
                taskStatusType,
                taskStatusLabel,
                displayModuleName,
                goToCreate
            };
        }
    });

    for (const [key, component] of Object.entries(icons)) {
        app.component(key, component);
    }
    app.use(ElementPlus);
    app.mount('#app');
</script>
</body>
</html>
