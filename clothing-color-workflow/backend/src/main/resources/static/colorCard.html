<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统色卡库管理</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="auth.js"></script>
    <style>
        body { margin: 0; min-height: 100vh; padding: 20px; font-family: 'PingFang SC', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); }
        .page-wrap { max-width: 1400px; margin: 0 auto; }
        .dashboard-card { border-radius: 12px !important; box-shadow: 0 8px 24px rgba(0,0,0,0.1) !important; border: none !important; }
        .el-card__header { background: #67c23a; color: white; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .thumbnail { width: 60px; height: 60px; border-radius: 6px; border: 1px solid #ddd; object-fit: cover; }
        .preview-box { width: 100px; height: 100px; border: 1px dashed #dcdfe6; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-top: 10px; background: #fafafa; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .hidden-input { display: none; }
        /* 🔴 强制修复 Element Plus 消息提示框被遮挡的问题 */
        .el-message {
            z-index: 99999 !important; /* 把层级提到最高，神挡杀神 */
            top: 80px !important;      /* 强制往下挪 80px，避开顶部导航栏。如果不够可以改成 100px */
        }

        /* 🔴 顺手修复：如果是居中的“确认删除”弹窗被遮挡，加这个 */
        .el-overlay.is-message-box {
            z-index: 99999 !important;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="page-wrap">
        <el-card class="dashboard-card">
            <template #header>
                <span>📚 品牌数字资产 - 系统色卡库管理</span>
                <div style="display: flex; gap: 10px;">
                    <el-button type="primary" color="#1e88e5" @click="goToWorkflow">🎨 去换色工作流</el-button>
                    <el-button color="#f5f7fa" style="color: #606266; font-weight: bold;" @click="goToList">📊 任务大盘</el-button>
                </div>
            </template>

            <div style="margin-bottom: 20px; display: flex; gap: 15px; align-items: center; background: #fff; padding: 15px; border-radius: 8px;">
                <el-button type="success" @click="openDialog()">➕ 新增色卡</el-button>

                <el-tooltip content="请同时选中 1份Excel 和 多张图片。支持色卡和案例图匹配" placement="top">
                    <el-button type="warning" plain @click="$refs.batchInput.click()" :loading="importing">📥 图文混合批量导入</el-button>
                </el-tooltip>
                <input type="file" ref="batchInput" class="hidden-input" multiple accept=".xlsx, .xls, .csv, image/*" @change="handleBatchImport">

                <el-button type="danger" :disabled="selectedIds.length === 0" @click="handleBatchDelete">🗑️ 批量删除</el-button>

                <el-divider direction="vertical"></el-divider>

                <el-input v-model="filters.patternName" placeholder="花型名称" style="width: 200px" clearable @keyup.enter="fetchData"></el-input>
                <el-input v-model="filters.fabricType" placeholder="面料类型" style="width: 200px" clearable @keyup.enter="fetchData"></el-input>
                <el-select v-model="filters.printType" placeholder="印花类型" clearable style="width: 120px" @change="fetchData">
                    <el-option label="纯色" :value="1"></el-option>
                    <el-option label="印花" :value="2"></el-option>
                </el-select>
                <el-button type="primary" @click="fetchData">🔍 搜索</el-button>
            </div>

            <el-table :data="tableData" v-loading="loading || importing" border stripe style="width: 100%" @selection-change="handleSelectionChange">
                <el-table-column type="selection" width="55" align="center"></el-table-column>
                <el-table-column prop="id" label="ID" width="70" align="center"></el-table-column>
                <el-table-column label="色卡图" width="100" align="center">
                    <template #default="scope">
                        <el-image v-if="scope.row.colorCardUrl" class="thumbnail" :src="scope.row.colorCardUrl" :preview-src-list="[scope.row.colorCardUrl]" preview-teleported fit="cover"></el-image>
                        <span v-else style="color: #999; font-size: 12px;">无图</span>
                    </template>
                </el-table-column>
                <el-table-column label="案例图" width="100" align="center">
                    <template #default="scope">
                        <el-image v-if="scope.row.exampleUrl" class="thumbnail" :src="scope.row.exampleUrl" :preview-src-list="[scope.row.exampleUrl]" preview-teleported fit="cover"></el-image>
                        <span v-else style="color: #999; font-size: 12px;">无图</span>
                    </template>
                </el-table-column>
                <el-table-column prop="fabricType" label="面料类型" min-width="150"></el-table-column>
                <el-table-column prop="patternName" label="花型名称" min-width="120"></el-table-column>
                <el-table-column prop="patternCode" label="花型编号" width="100" align="center"></el-table-column>
                <el-table-column label="印花类型" width="100" align="center">
                    <template #default="scope">
                        <el-tag :type="scope.row.printType === 1 ? 'info' : 'warning'">{{ scope.row.printType === 1 ? '纯色' : '印花' }}</el-tag>
                    </template>
                </el-table-column>
                <el-table-column label="操作" width="160" align="center" fixed="right">
                    <template #default="scope">
                        <el-button size="small" type="primary" plain @click="openDialog(scope.row)">编辑</el-button>
                        <el-button size="small" type="danger" plain @click="handleDelete(scope.row.id)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>

            <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
                <el-pagination
                        v-model:current-page="pageParams.current"
                        v-model:page-size="pageParams.size"
                        :page-sizes="[10, 20, 50, 100]"
                        layout="total, sizes, prev, pager, next, jumper"
                        :total="total"
                        @size-change="fetchData"
                        @current-change="fetchData">
                </el-pagination>
            </div>
        </el-card>

        <el-dialog :title="form.id ? '✏️ 编辑色卡' : '➕ 新增色卡'" v-model="dialogVisible" width="600px" @close="resetForm">
            <el-form label-width="100px" v-loading="uploading">
                <el-row :gutter="20">
                    <el-col :span="12"><el-form-item label="面料类型"><el-input v-model="form.fabricType" placeholder="如: 666气流冰丝皱"></el-input></el-form-item></el-col>
                    <el-col :span="12">
                        <el-form-item label="印花类型">
                            <el-select v-model="form.printType" style="width: 100%;">
                                <el-option label="纯色 (1)" :value="1"></el-option>
                                <el-option label="印花 (2)" :value="2"></el-option>
                            </el-select>
                        </el-form-item>
                    </el-col>
                </el-row>
                <el-row :gutter="20">
                    <el-col :span="12"><el-form-item label="花型名称"><el-input v-model="form.patternName" placeholder="如: 黑底灰蝴蝶"></el-input></el-form-item></el-col>
                    <el-col :span="12"><el-form-item label="花型编号"><el-input v-model="form.patternCode" placeholder="如: 21#"></el-input></el-form-item></el-col>
                </el-row>
                <el-form-item label="色卡原图">
                    <el-button type="primary" plain size="small" @click="$refs.colorInput.click()">上传色卡图</el-button>
                    <input type="file" ref="colorInput" class="hidden-input" accept="image/*" @change="e => uploadToOss(e, 'colorCardUrl')">
                    <div class="preview-box" v-if="form.colorCardUrl"><img :src="form.colorCardUrl" /></div>
                </el-form-item>
                <el-form-item label="参考案例图">
                    <el-button type="info" plain size="small" @click="$refs.exampleInput.click()">上传案例图 (选填)</el-button>
                    <input type="file" ref="exampleInput" class="hidden-input" accept="image/*" @change="e => uploadToOss(e, 'exampleUrl')">
                    <div class="preview-box" v-if="form.exampleUrl"><img :src="form.exampleUrl" /></div>
                </el-form-item>
            </el-form>
            <template #footer>
                <span class="dialog-footer"><el-button @click="dialogVisible = false">取消</el-button><el-button type="success" @click="submitForm" :loading="saving">保存色卡</el-button></span>
            </template>
        </el-dialog>
    </div>
</div>

<script>
    // 🔴 全局拦截：强制把所有提示框的停留时间延长到 5 秒（5000毫秒）
    ['success', 'warning', 'info', 'error'].forEach(type => {
        ElementPlus.ElMessage[type] = (msg) => {
            return ElementPlus.ElMessage({ message: msg, type: type, duration: 5000 }); // 你可以把 5000 改成 8000(8秒) 等任意时间
        };
    });
    const { createApp, ref, reactive, onMounted } = Vue;
    createApp({
        setup() {
            // 基础状态变量
            const tableData = ref([]), loading = ref(false), dialogVisible = ref(false);
            const uploading = ref(false), saving = ref(false), importing = ref(false);

            // 搜索与分页相关变量
            const filters = reactive({ patternName: '', fabricType: '', printType: null });
            const pageParams = reactive({ current: 1, size: 10 });
            const total = ref(0);
            const selectedIds = ref([]);

            const form = reactive({ id: null, fabricType: '', printType: 1, patternName: '', patternCode: '', colorCardUrl: '', exampleUrl: '' });

            // 监听多选框变化
            const handleSelectionChange = (val) => {
                selectedIds.value = val.map(item => item.id);
            };

            // 获取分页数据 (对接后端 /page 接口)
            const fetchData = async () => {
                loading.value = true;
                try {
                    const params = {
                        current: pageParams.current,
                        size: pageParams.size,
                        fabricType: filters.fabricType || undefined,
                        printType: filters.printType || undefined,
                        patternName: filters.patternName || undefined
                    };
                    const res = await axios.get('/api/color-cards/page', { params });
                    if (res.data.success) {
                        tableData.value = res.data.data.content;
                        total.value = res.data.data.totalElements;
                    }
                } catch (e) { ElementPlus.ElMessage.error('获取列表失败'); }
                finally { loading.value = false; }
            };

            // 弹窗与表单控制
            const openDialog = (row = null) => {
                if (row) Object.assign(form, row);
                else resetForm();
                dialogVisible.value = true;
            };

            const resetForm = () => { form.id = null; form.fabricType = ''; form.printType = 1; form.patternName = ''; form.patternCode = ''; form.colorCardUrl = ''; form.exampleUrl = ''; };

            // OSS 直传
            const uploadToOss = async (event, fieldName) => {
                const file = event.target.files[0]; if (!file) return;

                // 🔴 新增：限制单张图片大小不能超过 5MB
                if (file.size > 5 * 1024 * 1024) {
                    ElementPlus.ElMessage.error(`【${file.name}】 图片大小超过 5MB，请压缩后重试！`);
                    event.target.value = ''; // 清空选中状态，允许用户重新选择同一文件
                    return; // 拦截，终止上传
                }

                uploading.value = true;
                try {
                    const policyRes = await axios.get('/api/oss/policy');
                    const policyData = policyRes.data.data;
                    const suffix = file.name.substring(file.name.lastIndexOf('.'));
                    const finalKey = `${policyData.dir}color_card_${Date.now()}_${Math.random().toString(36).substr(2, 6)}${suffix}`;
                    const fd = new FormData();
                    fd.append('key', finalKey); fd.append('policy', policyData.policy); fd.append('OSSAccessKeyId', policyData.accessid); fd.append('success_action_status', '200'); fd.append('signature', policyData.signature); fd.append('file', file);
                    await axios.post(policyData.host, fd);
                    form[fieldName] = `${policyData.host}/${finalKey}`;
                    ElementPlus.ElMessage.success('上传成功！');
                } catch (e) { ElementPlus.ElMessage.error('上传失败'); } finally { uploading.value = false; event.target.value = ''; }
            };

            // 保存单条数据
            const submitForm = async () => {
                if (!form.fabricType || !form.colorCardUrl) return ElementPlus.ElMessage.warning('信息不完整！');
                saving.value = true;
                try {
                    const res = await axios.post('/api/color-cards/save', form);
                    if (res.data.success) { ElementPlus.ElMessage.success('保存成功！'); dialogVisible.value = false; fetchData(); }
                    else { ElementPlus.ElMessage.error(res.data.message || '保存失败'); }
                } catch (e) { ElementPlus.ElMessage.error('保存异常'); } finally { saving.value = false; }
            };

            // 单条删除
            const handleDelete = async (id) => {
                try {
                    await ElementPlus.ElMessageBox.confirm('确认要永久删除这个色卡吗?', '警告', { type: 'warning' });
                    const res = await axios.delete(`/api/color-cards/${id}`);
                    if (res.data.success) { ElementPlus.ElMessage.success('删除成功！'); fetchData(); }
                } catch (e) { if (e !== 'cancel') ElementPlus.ElMessage.error('删除失败'); }
            };

            // 批量删除
            const handleBatchDelete = async () => {
                if (selectedIds.value.length === 0) return;
                try {
                    await ElementPlus.ElMessageBox.confirm(`确认要永久删除选中的 ${selectedIds.value.length} 条色卡吗?`, '危险操作', { type: 'error' });
                    const res = await axios.post('/api/color-cards/batch-delete', selectedIds.value);
                    if (res.data.success) {
                        ElementPlus.ElMessage.success('批量删除成功！');
                        fetchData();
                    }
                } catch (e) { /* 用户取消 */ }
            };

            // 图文混合批量导入
            const handleBatchImport = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                const excelFile = files.find(f => f.name.endsWith('.xlsx') || f.name.endsWith('.xls') || f.name.endsWith('.csv'));
                const imageFiles = files.filter(f => f.type.startsWith('image/'));

                // 🔴 新增：批量检查图片大小
                if (imageFiles.length > 0) {
                    // 过滤出所有大于 5MB 的图片
                    const oversizedFiles = imageFiles.filter(f => f.size > 10 * 1024 * 1024);

                    if (oversizedFiles.length > 0) {
                        // 提取几张超大图片的名字展示给用户看，方便他们定位
                        const badNames = oversizedFiles.slice(0, 3).map(f => f.name).join('、');
                        const moreTxt = oversizedFiles.length > 3 ? '等...' : '';

                        ElementPlus.ElMessage.error({
                            message: `批量导入失败：包含 ${oversizedFiles.length} 张超过 5MB 的超大图片 (${badNames}${moreTxt})，请先压缩！`,
                            duration: 6000 // 提示框停留长一点让用户看清
                        });

                        e.target.value = ''; // 清空选中状态
                        return; // 拦截，彻底终止导入流程
                    }
                }

                if (!excelFile) {
                    ElementPlus.ElMessage.warning('请确保选中了包含数据的 Excel 表格！');
                    e.target.value = '';
                    return;
                }

                importing.value = true;
                let successCount = 0;
                const imageUrlMap = {};

                try {
                    if (imageFiles.length > 0) {
                        ElementPlus.ElMessage.info(`正在并发上传 ${imageFiles.length} 张图片到云端...`);
                        const policyRes = await axios.get('/api/oss/policy');
                        const policyData = policyRes.data.data;

                        const uploadPromises = imageFiles.map(async (file) => {
                            const suffix = file.name.substring(file.name.lastIndexOf('.'));
                            const finalKey = `${policyData.dir}color_card_batch_${Date.now()}_${Math.random().toString(36).substr(2, 4)}${suffix}`;

                            const fd = new FormData();
                            fd.append('key', finalKey); fd.append('policy', policyData.policy);
                            fd.append('OSSAccessKeyId', policyData.accessid); fd.append('success_action_status', '200');
                            fd.append('signature', policyData.signature); fd.append('file', file);

                            await axios.post(policyData.host, fd);
                            imageUrlMap[file.name] = `${policyData.host}/${finalKey}`;
                        });
                        await Promise.all(uploadPromises);
                    }

                    const reader = new FileReader();
                    reader.onload = async (evt) => {
                        try {
                            const data = evt.target.result;
                            const workbook = XLSX.read(data, { type: 'binary' });
                            const sheet = workbook.Sheets[workbook.SheetNames[0]];
                            const jsonData = XLSX.utils.sheet_to_json(sheet);

                            if(jsonData.length === 0) return ElementPlus.ElMessage.warning('表格数据为空！');

                            ElementPlus.ElMessage.info(`正在排重保存 ${jsonData.length} 条数据，请稍候...`);

                            for (const row of jsonData) {
                                const rawColorStr = row['色卡文件名'] || row['色卡图片链接'] || '';
                                const rawExampleStr = row['案例文件名'] || row['参考案例链接'] || '';

                                const finalColorUrl = imageUrlMap[rawColorStr] || rawColorStr;
                                const finalExampleUrl = imageUrlMap[rawExampleStr] || rawExampleStr;

                                const payload = {
                                    fabricType: row['面料类型'] || '',
                                    printType: row['印花类型'] === '印花' ? 2 : 1,
                                    patternName: row['花型名称'] || '',
                                    patternCode: String(row['花型编号'] || ''),
                                    colorCardUrl: finalColorUrl,
                                    exampleUrl: finalExampleUrl
                                };

                                if(payload.fabricType && payload.colorCardUrl) {
                                    try {
                                        const res = await axios.post('/api/color-cards/save', payload);
                                        // 只有当后端返回 true 时才算成功录入（比如触发了重复拦截就会返回 false）
                                        if (res.data.success) successCount++;
                                    } catch (err) { console.warn('保存失败或被拦截:', row); }
                                }
                            }

                            ElementPlus.ElMessage.success(`🎉 处理完毕！成功添加 ${successCount} 条全新色卡数据。`);
                            fetchData();

                        } catch (err) { ElementPlus.ElMessage.error('解析 Excel 文件失败！'); }
                        finally { importing.value = false; e.target.value = ''; }
                    };
                    reader.readAsBinaryString(excelFile);

                } catch (error) {
                    console.error(error);
                    ElementPlus.ElMessage.error('图片上传失败，请检查网络！');
                    importing.value = false; e.target.value = '';
                }
            };

            const goToWorkflow = () => window.location.href = 'index.html';
            const goToList = () => window.location.href = 'list.html';

            onMounted(fetchData);

            return {
                tableData, loading, dialogVisible, form, uploading, saving, importing,
                filters, pageParams, total, selectedIds,
                fetchData, openDialog, resetForm, uploadToOss, submitForm,
                handleDelete, handleBatchDelete, handleSelectionChange, handleBatchImport,
                goToWorkflow, goToList
            };
        }
    }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
