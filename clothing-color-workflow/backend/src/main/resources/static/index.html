<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 批量换色工作流</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"/>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <script src="auth.js"></script>

    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; margin: 0; font-family: 'PingFang SC', sans-serif; padding-top: 3vh; padding-bottom: 5vh; }
        .workflow-card { max-width: 1000px; margin: 0 auto; border-radius: 16px !important; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08) !important; border: none !important; }
        .workflow-card .el-card__header { background: #409EFF; color: white; border-bottom: none; padding: 15px 20px;}
        .section-title { font-size: 16px; font-weight: bold; color: #303133; margin: 20px 0 15px 0; border-left: 4px solid #409EFF; padding-left: 10px; }
        .hidden-input { display: none; }
        .drop-zones-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .drop-zone { flex: 1; border: 2px dashed #dcdfe6; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; background: #fafafa; color: #606266; }
        .drop-zone:hover { border-color: #409EFF; background: #f0f7ff; }
        .drop-zone.is-dragover { border-color: #67c23a; background: #f0f9eb; transform: scale(1.02); }
        .drop-zone .icon { font-size: 28px; display: block; margin-bottom: 5px; }
        .matrix-wrapper { width: 100%; overflow-x: auto; background: #fff; border-radius: 8px; border: 1px solid #ebeef5; }
        .matrix-table { width: 100%; border-collapse: collapse; min-width: 500px; }
        .matrix-table th, .matrix-table td { border: 1px solid #ebeef5; padding: 12px; text-align: center; vertical-align: middle; }
        .matrix-table th { background-color: #f8f9fa; font-weight: bold; color: #606266; }
        .matrix-corner { min-width: 100px; color: #909399; font-size: 13px; }
        .thumb-wrapper { position: relative; display: inline-block; width: 70px; height: 70px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1); border: 2px solid transparent; }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
        .remove-btn { position: absolute; top: -6px; right: -6px; background-color: rgba(245, 108, 108, 0.95); color: white; border-radius: 50%; width: 20px; height: 20px; line-height: 18px; text-align: center; cursor: pointer; z-index: 10; font-size: 12px; font-weight: bold; }
        .remove-btn:hover { transform: scale(1.15); background-color: #f56c6c; }
        .pair-cell { cursor: pointer; position: relative; }
        .pair-cell:hover { background-color: #f0f7ff; }
        .pair-status { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 8px; transition: 0.3s; font-size: 20px; }
        .pair-status.active { background-color: #67c23a; color: white; box-shadow: 0 4px 10px rgba(103, 194, 58, 0.3); transform: scale(1.1); }
        .pair-status.inactive { background-color: #f4f4f5; color: #c0c4cc; border: 2px dashed #dcdfe6; transform: scale(0.9); }
        .empty-state { padding: 40px; text-align: center; color: #909399; background: #fafafa; border-radius: 8px; border: 1px dashed #dcdfe6; }
        .submit-btn { width: 100%; height: 50px; font-size: 18px; border-radius: 12px; margin-top: 25px; }
        .db-img-container { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 5px; }
        .db-img-container .el-image { border: 1px solid #eee; transition: 0.3s; }
        .db-img-container .el-image:hover { border-color: #409EFF; transform: translateY(-2px); }
    </style>
</head>
<body>
<div id="app">
    <el-card class="workflow-card">
        <template #header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span style="margin-right: 15px; font-size: 18px; font-weight: bold;">✨ AI 换图</span>
                    <el-button color="#fff" style="color: #409EFF; border: none; font-weight: bold; cursor: default;">🎨 批量换色 (当前)</el-button>
                    <el-button type="primary" color="#1e88e5" @click="goToScene">🖼️ 场景生成</el-button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <el-button @click="goToColorManage" color="#67c23a" style="color: #fff;">📚 色卡库维护</el-button>
                    <el-button @click="goToList" color="#f5f7fa" style="color: #606266; font-weight: bold;">📊 任务大盘</el-button>
                </div>
            </div>
        </template>

        <div class="section-title">1. 基础信息</div>
        <el-form label-width="90px" style="padding: 0 10px;">
            <el-row :gutter="20">
                <el-col :span="6"><el-form-item label="SPU 款号"><el-input v-model="form.spu" placeholder="请输入商品款号"/></el-form-item></el-col>
                <el-col :span="6"><el-form-item label="AI 模型"><el-input v-model="form.model" placeholder="nano-banana-pro"/></el-form-item></el-col>
                <el-col :span="6">
                    <el-form-item label="分辨率">
                        <el-select v-model="form.resolution" style="width: 100%;">
                            <el-option label="2K" value="2K"></el-option><el-option label="4K" value="4K"></el-option>
                        </el-select>
                    </el-form-item>
                </el-col>
                <el-col :span="6"><el-form-item label="画面比例"><el-input v-model="form.aspect_ratio" placeholder="auto"/></el-form-item></el-col>
            </el-row>
            <el-row :gutter="20">
                <el-col :span="8"><el-form-item label="衣服类型"><el-input v-model="form.type" placeholder="eg: cardigan..." @input="updatePrompt"/></el-form-item></el-col>
                <el-col :span="16"><el-form-item label="提示词"><el-input type="textarea" v-model="form.prompt" rows="3"/></el-form-item></el-col>
            </el-row>
        </el-form>

        <div class="section-title">2. 自动搭配矩阵</div>
        <div class="drop-zones-container">
            <div class="drop-zone" :class="{ 'is-dragover': drag.input }" @click="$refs.inputRef.click()" @dragover.prevent="drag.input = true" @dragleave.prevent="drag.input = false" @drop.prevent="e => handleDrop(e, 'input')">
                <span class="icon">👕</span><div>点击/拖拽上传 <b>原图</b></div>
                <input type="file" multiple ref="inputRef" @change="e => handleUpload(e, 'input')" accept="image/*" class="hidden-input"/>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 10px;">
                <div class="drop-zone" :class="{ 'is-dragover': drag.color }" @click="$refs.colorRef.click()" @dragover.prevent="drag.color = true" @dragleave.prevent="drag.color = false" @drop.prevent="e => handleDrop(e, 'color')" style="height: 100%;">
                    <span class="icon">🎨</span><div>点击/拖拽上传 <b>本地颜色图</b></div>
                    <input type="file" multiple ref="colorRef" @change="e => handleUpload(e, 'color')" accept="image/*" class="hidden-input"/>
                </div>
                <el-button type="success" plain @click="openColorCardDialog" style="width: 100%; height: 40px;">
                    📚 从系统色卡库提取
                </el-button>
            </div>
        </div>

        <div v-if="inputPool.length === 0 && colorPool.length === 0" class="empty-state">
            <div style="font-size: 40px; margin-bottom: 10px;">📦</div>请在上方拖入 <b>原图</b> 或 <b>颜色图</b>，构建搭配矩阵。
        </div>
        <div v-else class="matrix-wrapper">
            <table class="matrix-table">
                <thead>
                <tr>
                    <th class="matrix-corner">原图 ↓ \ 颜色 →</th>
                    <th v-for="(col, cIndex) in colorPool" :key="col.id">
                        <div class="thumb-wrapper" style="border-color: #67c23a;"><img :src="col.url" class="thumb-img"/><div class="remove-btn" @click="removeImage('color', cIndex)">X</div></div>
                    </th>
                    <th v-if="colorPool.length === 0" style="padding: 20px; color:#999;">👉 等待添加颜色图...</th>
                </tr>
                </thead>
                <tbody>
                <tr v-if="inputPool.length === 0"><td style="padding: 20px; color:#999;">👇 等待添加原图...</td><td v-for="col in colorPool" :key="col.id" style="background-color: #fafafa;"></td></tr>
                <tr v-for="(inp, iIndex) in inputPool" :key="inp.id">
                    <td style="background-color: #f8f9fa;">
                        <div class="thumb-wrapper" style="border-color: #409EFF;"><img :src="inp.url" class="thumb-img"/><div class="remove-btn" @click="removeImage('input', iIndex)">X</div></div>
                    </td>
                    <td v-for="col in colorPool" :key="col.id" class="pair-cell" @click="togglePair(inp.id, col.id)">
                        <div class="pair-status" :class="pairingState[`${inp.id}_${col.id}`] ? 'active' : 'inactive'">{{ pairingState[`${inp.id}_${col.id}`] ? '✓' : '×' }}</div>
                    </td>
                    <td v-if="colorPool.length === 0" style="background-color: #fafafa;"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <el-button type="primary" class="submit-btn" @click="submit" :loading="loading" :disabled="activeTaskCount === 0">
            {{ loading ? uploadProgressMsg : `🚀 立即提交 ${activeTaskCount} 个换色任务` }}
        </el-button>
    </el-card>

    <el-drawer v-model="colorCardDrawer" title="📚 系统色卡库 (选取色卡或案例图)" size="55%">
        <div style="padding: 0 15px 15px 15px; display: flex; gap: 10px;">
            <el-input v-model="drawerFilter.patternName" placeholder="花型名称筛选 (支持多个,用逗号隔开)" clearable style="flex: 1"></el-input>
            <el-input v-model="drawerFilter.fabricType" placeholder="面料搜索" clearable style="width: 150px"></el-input>
        </div>

        <el-table :data="filteredDbColorCards" border stripe>
            <el-table-column prop="fabricType" label="面料" min-width="120"></el-table-column>
            <el-table-column prop="patternName" label="花型" min-width="120"></el-table-column>

            <el-table-column label="选取色卡图" width="130" align="center">
                <template #default="scope">
                    <div class="db-img-container">
                        <el-image style="width: 80px; height: 80px; border-radius: 4px;" :src="scope.row.colorCardUrl" fit="cover" :preview-src-list="[scope.row.colorCardUrl]" preview-teleported></el-image>
                        <el-button type="primary" size="small" plain @click="addSingleToMatrix(scope.row, scope.row.colorCardUrl, '色卡')">选取色卡</el-button>
                    </div>
                </template>
            </el-table-column>

            <el-table-column label="选取案例图" width="130" align="center">
                <template #default="scope">
                    <div v-if="scope.row.exampleUrl" class="db-img-container">
                        <el-image style="width: 80px; height: 80px; border-radius: 4px;" :src="scope.row.exampleUrl" fit="cover" :preview-src-list="[scope.row.exampleUrl]" preview-teleported></el-image>
                        <el-button type="success" size="small" plain @click="addSingleToMatrix(scope.row, scope.row.exampleUrl, '案例')">选取案例</el-button>
                    </div>
                    <span v-else style="color: #999; font-size: 12px;">无案例图</span>
                </template>
            </el-table-column>

            <el-table-column label="类型" width="70" align="center">
                <template #default="scope">
                    <el-tag size="small" :type="scope.row.printType === 1 ? 'info' : 'warning'">{{ scope.row.printType === 1 ? '纯色' : '印花' }}</el-tag>
                </template>
            </el-table-column>
        </el-table>
        <template #footer>
            <div style="text-align: right;">
                <el-button @click="colorCardDrawer = false">关闭抽屉</el-button>
            </div>
        </template>
    </el-drawer>
</div>

<script>
    const {createApp, ref, reactive, computed} = Vue;
    createApp({
        setup() {
            const basePromptTemplate = "Please replace the color of the 【衣服类型】 in the image with the average color from the solid color block in the reference image. Ensure that only the color of the 【衣服类型】 is modified, keeping all other details and the background unchanged.";
            const form = reactive({ spu: '', model: 'nano-banana-pro', resolution: '4K', type: '', aspect_ratio: 'auto', prompt: basePromptTemplate });
            const loading = ref(false), uploadProgressMsg = ref('正在处理...');
            const inputPool = ref([]), colorPool = ref([]), pairingState = reactive({}), drag = reactive({input: false, color: false});

            const updatePrompt = () => { form.prompt = basePromptTemplate.replace(/【衣服类型】/g, form.type && form.type.trim() ? form.type : '【衣服类型】'); };
            const processFiles = (files, type) => {
                files.forEach(file => {
                    const newItem = { id: type + '_' + Date.now() + '_' + Math.floor(Math.random() * 1000), file: file, url: URL.createObjectURL(file), ossUrl: null };
                    if (type === 'input') { inputPool.value.push(newItem); colorPool.value.forEach(col => pairingState[`${newItem.id}_${col.id}`] = true); }
                    else { colorPool.value.push(newItem); inputPool.value.forEach(inp => pairingState[`${inp.id}_${newItem.id}`] = true); }
                });
            };
            const handleUpload = (e, type) => { processFiles(Array.from(e.target.files).filter(f => f.type.startsWith('image/')), type); e.target.value = ''; };
            const handleDrop = (e, type) => { drag[type] = false; processFiles(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')), type); };
            const removeImage = (type, index) => { type === 'input' ? inputPool.value.splice(index, 1) : colorPool.value.splice(index, 1); };
            const togglePair = (inpId, colId) => { pairingState[`${inpId}_${colId}`] = !pairingState[`${inpId}_${colId}`]; };
            const activeTaskCount = computed(() => { let count = 0; inputPool.value.forEach(inp => colorPool.value.forEach(col => { if (pairingState[`${inp.id}_${col.id}`]) count++; })); return count; });

            // 色卡库功能
            const colorCardDrawer = ref(false);
            const dbColorCards = ref([]);
            const drawerFilter = reactive({ patternName: '', fabricType: '' });

            const filteredDbColorCards = computed(() => {
                return dbColorCards.value.filter(item => {
                    const matchFabric = !drawerFilter.fabricType || (item.fabricType && item.fabricType.includes(drawerFilter.fabricType));
                    if (!drawerFilter.patternName) return matchFabric;
                    const keywords = drawerFilter.patternName.toLowerCase().replace(/，/g, ',').split(',').map(s => s.trim()).filter(s => s);
                    const matchPattern = keywords.some(key => item.patternName && item.patternName.toLowerCase().includes(key));
                    return matchFabric && matchPattern;
                });
            });

            const openColorCardDialog = async () => {
                colorCardDrawer.value = true;
                try {
                    const res = await axios.get('/api/color-cards/list');
                    if (res.data.success) dbColorCards.value = res.data.data;
                } catch (e) { ElementPlus.ElMessage.error('获取色卡库失败'); }
            };

            // 🔴 核心逻辑：单张图片添加到矩阵 (区分色卡/案例)
            const addSingleToMatrix = (card, imageUrl, typeName) => {
                // 为图片生成唯一ID，防止同一张色卡被多次添加（区分来源类型）
                const uniqueId = `db_${card.id}_${typeName === '色卡' ? 'card' : 'example'}`;
                const exists = colorPool.value.find(c => c.id === uniqueId);
                if (exists) return ElementPlus.ElMessage.warning(`该${typeName}图已在矩阵中`);

                const newItem = {
                    id: uniqueId,
                    dbId: card.id,
                    file: null, // 非本地上传，设为null
                    url: imageUrl,
                    ossUrl: imageUrl // 已经是OSS链接，直接赋值
                };

                colorPool.value.push(newItem);
                // 默认让它与所有原图配对
                inputPool.value.forEach(inp => pairingState[`${inp.id}_${newItem.id}`] = true);
                ElementPlus.ElMessage.success(`已添加${typeName}图 [${card.patternName}] 到搭配矩阵`);
            };

            const directUploadToOss = async (itemObj, policyData) => {
                if (itemObj.ossUrl) return itemObj.ossUrl;
                const suffix = itemObj.file.name.substring(itemObj.file.name.lastIndexOf('.'));
                const finalKey = `${policyData.dir}${Date.now()}_${Math.random().toString(36).substr(2, 6)}${suffix}`;
                const fd = new FormData();
                fd.append('key', finalKey); fd.append('policy', policyData.policy); fd.append('OSSAccessKeyId', policyData.accessid); fd.append('success_action_status', '200'); fd.append('signature', policyData.signature); fd.append('file', itemObj.file);
                await axios.post(policyData.host, fd);
                itemObj.ossUrl = `${policyData.host}/${finalKey}`; return itemObj.ossUrl;
            };

            const submit = async () => {
                if (!form.spu) return ElementPlus.ElMessage.warning('SPU 款号不能为空！');
                if (activeTaskCount.value === 0) return ElementPlus.ElMessage.warning('当前没有选中的有效搭配任务！');

                // 1. 确认弹窗
                try {
                    await ElementPlus.ElMessageBox.confirm(
                        `系统将为您生成 ${activeTaskCount.value} 个换色任务，是否立即开始？`,
                        '提交确认',
                        { confirmButtonText: '确定提交', cancelButtonText: '我再想想', type: 'info' }
                    );
                } catch (e) { return; }

                // 2. 正式提交流程 (合并为一个 try-catch-finally)
                loading.value = true;
                try {
                    // 第一步：获取 OSS 策略
                    const policyRes = await axios.get('/api/oss/policy');
                    const policyData = policyRes.data.data;

                    // 第二步：上传图片
                    const neededInputs = new Set(), neededColors = new Set();
                    inputPool.value.forEach(inp => colorPool.value.forEach(col => {
                        if (pairingState[`${inp.id}_${col.id}`]) {
                            neededInputs.add(inp); neededColors.add(col);
                        }
                    }));

                    uploadProgressMsg.value = `并发上传 ${neededInputs.size + neededColors.size} 张图...`;
                    await Promise.all([...neededInputs, ...neededColors].map(item => directUploadToOss(item, policyData)));

                    // 第三步：派发任务
                    const pairsPayload = [];
                    inputPool.value.forEach(inp => colorPool.value.forEach(col => {
                        if (pairingState[`${inp.id}_${col.id}`]) pairsPayload.push({ inputUrl: inp.ossUrl, colorUrl: col.ossUrl });
                    }));

                    const finalPayload = {
                        spu: form.spu, prompt: form.prompt, model: form.model,
                        resolution: form.resolution, aspect_ratio: form.aspect_ratio,
                        pairs: pairsPayload, taskType: 1
                    };

                    uploadProgressMsg.value = '正在派发任务到 AI 队列...';
                    const res = await axios.post('/api/tasks/create', finalPayload);

                    // 🔴 关键修复：增加安全性判断
                    if (res.data && res.data.success) {
                        // 使用更健壮的方式获取长度，防止报错中断
                        const count = (res.data.data && Array.isArray(res.data.data)) ? res.data.data.length : pairsPayload.length;

                        // 弹出强力提示
                        ElementPlus.ElMessage({
                            message: `🚀 提交成功！已派发 ${count} 个换色任务。`,
                            type: 'success',
                            duration: 5000, // 显示 5 秒
                            showClose: true
                        });

                        // 清空矩阵
                        inputPool.value = []; colorPool.value = [];
                        for (let key in pairingState) delete pairingState[key];
                    } else {
                        ElementPlus.ElMessage.error(res.data.message || '后端返回失败');
                    }
                } catch (e) {
                    console.error("提交过程发生错误:", e);
                    ElementPlus.ElMessage.error('处理失败：请检查网络或 OSS 签名');
                } finally {
                    loading.value = false;
                    uploadProgressMsg.value = '正在处理...';
                }
            };

            const goToScene = () => { window.location.href = 'scene.html'; };
            const goToList = () => { window.location.href = 'list.html'; };
            const goToColorManage = () => { window.location.href = 'colorCard.html'; };

            return {
                form, inputPool, colorPool, pairingState, loading, uploadProgressMsg, activeTaskCount, drag,
                updatePrompt, handleUpload, handleDrop, removeImage, togglePair, submit,
                goToScene, goToList, goToColorManage,
                colorCardDrawer, dbColorCards, openColorCardDialog, addSingleToMatrix,
                drawerFilter, filteredDbColorCards
            };
        }
    }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
