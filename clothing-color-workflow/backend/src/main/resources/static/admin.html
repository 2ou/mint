<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>系统用户管理 (仅 PINKSIR 可见)</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"/>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="auth.js"></script>
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; margin: 0; font-family: 'PingFang SC', sans-serif; padding-top: 3vh; padding-bottom: 5vh; }
        .admin-card { max-width: 1000px; margin: 0 auto; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); border: none; }
        .admin-card .el-card__header { background: #E6A23C; color: white; border-bottom: none; padding: 15px 20px;}
        .el-message, .el-overlay.is-message-box { z-index: 99999 !important; top: 80px !important; }
    </style>
</head>
<body>
<div id="app">
    <el-card class="admin-card">
        <template #header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="font-size: 18px; font-weight: bold;">⚙️ 超级管理员面板 - 用户管理</div>
                <el-button @click="goBack" color="#f5f7fa" style="color: #606266; font-weight: bold;">返回大盘</el-button>
            </div>
        </template>

        <div style="margin-bottom: 15px;">
            <el-button type="primary" @click="openAddDialog" style="font-weight: bold;">➕ 新增用户账号</el-button>
        </div>

        <el-table :data="users" v-loading="loading" border stripe style="width: 100%; border-radius: 8px; overflow: hidden;">
            <el-table-column prop="id" label="ID" width="70" align="center"></el-table-column>
            <el-table-column prop="username" label="登录账号 (Username)" min-width="120">
                <template #default="scope">
                    <span style="font-weight: bold; color: #409EFF;">{{ scope.row.username }}</span>
                    <el-tag v-if="scope.row.username === 'PINKSIR'" size="small" type="danger" style="margin-left: 5px;">超级管理员</el-tag>
                </template>
            </el-table-column>
            <el-table-column prop="password" label="密码" width="120" align="center"></el-table-column>
            <el-table-column prop="shopName" label="所属店铺 (ShopName)" min-width="120"></el-table-column>
            <el-table-column prop="realName" label="真实姓名 (RealName)" min-width="120"></el-table-column>

            <el-table-column label="操作" width="180" align="center" fixed="right">
                <template #default="scope">
                    <el-button size="small" type="warning" plain @click="openEditDialog(scope.row)">修改</el-button>
                    <el-button size="small" type="danger" plain @click="handleDelete(scope.row)" :disabled="scope.row.username === 'PINKSIR'">删除</el-button>
                </template>
            </el-table-column>
        </el-table>
    </el-card>

    <el-dialog v-model="dialogVisible" :title="isEdit ? '✏️ 修改用户信息' : '➕ 新增用户'" width="400px">
        <el-form label-width="80px">
            <el-form-item label="登录账号">
                <el-input v-model="form.username" :disabled="isEdit" placeholder="必填"></el-input>
            </el-form-item>
            <el-form-item label="登录密码">
                <el-input v-model="form.password" placeholder="必填"></el-input>
            </el-form-item>
            <el-form-item label="所属店铺">
                <el-input v-model="form.shopName" placeholder="如：杭州一店"></el-input>
            </el-form-item>
            <el-form-item label="真实姓名">
                <el-input v-model="form.realName" placeholder="如：张三"></el-input>
            </el-form-item>
        </el-form>
        <template #footer>
            <span class="dialog-footer">
                <el-button @click="dialogVisible = false">取消</el-button>
                <el-button type="primary" @click="saveUser" :loading="saving">保存</el-button>
            </span>
        </template>
    </el-dialog>
</div>

<script>
    const { createApp, ref, reactive, onMounted } = Vue;
    createApp({
        setup() {
            const loading = ref(false);
            const saving = ref(false);
            const users = ref([]);

            const dialogVisible = ref(false);
            const isEdit = ref(false);
            const form = reactive({ id: null, username: '', password: '', shopName: '', realName: '' });

            const fetchUsers = async () => {
                loading.value = true;
                try {
                    const res = await axios.get('/api/admin/users/list');
                    if (res.data.success) {
                        users.value = res.data.data;
                    } else {
                        // 如果被拦截，直接踢回大盘
                        ElementPlus.ElMessage.error(res.data.message);
                        setTimeout(() => { window.location.href = 'list.html'; }, 1500);
                    }
                } catch (e) {
                    ElementPlus.ElMessage.error('无法获取用户列表');
                } finally {
                    loading.value = false;
                }
            };

            const openAddDialog = () => {
                isEdit.value = false;
                form.id = null; form.username = ''; form.password = ''; form.shopName = ''; form.realName = '';
                dialogVisible.value = true;
            };

            const openEditDialog = (row) => {
                isEdit.value = true;
                form.id = row.id; form.username = row.username; form.password = row.password;
                form.shopName = row.shopName; form.realName = row.realName;
                dialogVisible.value = true;
            };

            const saveUser = async () => {
                if (!form.username || !form.password) return ElementPlus.ElMessage.warning('账号和密码不能为空！');
                saving.value = true;
                try {
                    const url = isEdit.value ? `/api/admin/users/update/${form.id}` : '/api/admin/users/create';
                    const method = isEdit.value ? 'put' : 'post';
                    const res = await axios[method](url, form);

                    if (res.data.success) {
                        ElementPlus.ElMessage.success(res.data.message);
                        dialogVisible.value = false;
                        fetchUsers();
                    } else {
                        ElementPlus.ElMessage.error(res.data.message);
                    }
                } catch (e) {
                    ElementPlus.ElMessage.error('保存失败');
                } finally {
                    saving.value = false;
                }
            };

            const handleDelete = async (row) => {
                try {
                    await ElementPlus.ElMessageBox.confirm(`确定要永久删除账号【${row.username}】吗？`, '危险操作', { type: 'error' });
                    const res = await axios.delete(`/api/admin/users/delete/${row.id}`);
                    if (res.data.success) {
                        ElementPlus.ElMessage.success('删除成功');
                        fetchUsers();
                    } else {
                        ElementPlus.ElMessage.error(res.data.message);
                    }
                } catch (e) {}
            };

            const goBack = () => { window.location.href = 'list.html'; };

            onMounted(() => fetchUsers());

            return {
                users, loading, dialogVisible, isEdit, form, saving,
                openAddDialog, openEditDialog, saveUser, handleDelete, goBack
            };
        }
    }).use(ElementPlus).mount('#app');
</script>
</body>
</html>
