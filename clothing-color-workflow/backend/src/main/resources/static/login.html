<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 时尚视觉设计平台 - 登录</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"/>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>

    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('bg.png') no-repeat center center/cover;
            font-family: 'PingFang SC', sans-serif;
        }
        .login-box { width: 400px; padding: 40px; background: rgba(255, 255, 255, 0.95); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; backdrop-filter: blur(5px); }
        .title { font-size: 24px; font-weight: bold; color: #303133; margin-bottom: 30px; }
        .submit-btn { width: 100%; height: 45px; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>
<div id="app">
    <div class="login-box">
        <div class="title">✨ AI 时尚视觉设计平台<br><span style="font-size: 16px; color: #909399; font-weight: normal; margin-top: 5px; display: inline-block;">内部管理系统登录</span></div>
        <el-form :model="form" @keyup.enter="handleLogin">
            <el-form-item>
                <el-input v-model="form.username" placeholder="请输入账号" size="large" prefix-icon="User"></el-input>
            </el-form-item>
            <el-form-item>
                <el-input v-model="form.password" type="password" placeholder="请输入密码" size="large" prefix-icon="Lock" show-password></el-input>
            </el-form-item>
            <el-button type="primary" class="submit-btn" :loading="loading" @click="handleLogin">登 录</el-button>
        </el-form>
    </div>
</div>

<script>
    const { createApp, reactive, ref } = Vue;
    const app = createApp({
        setup() {
            const form = reactive({ username: '', password: '' });
            const loading = ref(false);

            const handleLogin = async () => {
                if (!form.username || !form.password) return ElementPlus.ElMessage.warning("请填写完整账号密码");
                loading.value = true;
                try {
                    const res = await axios.post('/api/auth/login', form);
                    if (res.data.success) {
                        // 登录成功，将 Token 和 账号信息 存入本地浏览器
                        localStorage.setItem("user_token", res.data.data.token);
                        localStorage.setItem("user_name", res.data.data.realName);
                        localStorage.setItem("shop_name", res.data.data.shopName);

                        ElementPlus.ElMessage.success("登录成功！即将跳转...");
                        setTimeout(() => window.location.href = 'index.html', 1000);
                    } else {
                        ElementPlus.ElMessage.error(res.data.message || "登录失败");
                    }
                } catch (e) {
                    ElementPlus.ElMessage.error("网络或服务异常");
                } finally {
                    loading.value = false;
                }
            };
            return { form, loading, handleLogin };
        }
    });

    // 🔴 修复2：将所有的图标遍历注册为全局组件，让 User 和 Lock 图标能正常显示出来
    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
        app.component(key, component);
    }

    app.use(ElementPlus).mount('#app');
</script>
</body>
</html>
