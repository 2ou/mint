<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 时尚视觉设计平台 - 登录</title>
    <link rel="stylesheet" href="css/variables.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"/>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--app-font-family);
            min-height: 100vh;
            display: flex;
            background: #f5f7fa;
        }

        /* ---- 左侧品牌区 ---- */
        .brand-panel {
            flex: 0 0 40%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }
        .brand-panel::before {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(102,126,234,0.15) 0%, transparent 70%);
            top: -100px; right: -100px;
        }
        .brand-panel::after {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(118,75,162,0.12) 0%, transparent 70%);
            bottom: -80px; left: -80px;
        }
        .brand-logo {
            font-size: 48px;
            margin-bottom: 24px;
            z-index: 1;
        }
        .brand-title {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            text-align: center;
            line-height: 1.3;
            z-index: 1;
            margin-bottom: 16px;
        }
        .brand-title span {
            background: linear-gradient(135deg, #667eea, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-desc {
            font-size: 15px;
            color: rgba(255,255,255,0.5);
            text-align: center;
            max-width: 380px;
            line-height: 1.7;
            z-index: 1;
        }
        .brand-features {
            display: flex; gap: 32px; margin-top: 48px; z-index: 1;
        }
        .brand-feat {
            text-align: center;
        }
        .brand-feat-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .brand-feat-text {
            font-size: 12px;
            color: rgba(255,255,255,0.45);
            letter-spacing: 0.05em;
        }

        /* ---- 右侧登录区 ---- */
        .login-panel {
            flex: 1;
            min-width: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 48px;
            background: #fff;
            position: relative;
        }
        .login-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f472b6);
        }
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }
        .login-header p {
            font-size: 14px;
            color: #909399;
        }
        .login-form {
            width: 100%;
            max-width: 360px;
        }
        .login-form .el-input__wrapper {
            border-radius: 10px;
            padding: 4px 12px;
            box-shadow: 0 0 0 1px #dcdfe6 inset;
            transition: all 0.2s;
        }
        .login-form .el-input__wrapper:hover {
            box-shadow: 0 0 0 1px #c0c4cc inset;
        }
        .login-form .el-input__wrapper.is-focus {
            box-shadow: 0 0 0 1px #409EFF inset, 0 0 0 3px rgba(64,158,255,0.1);
        }
        .login-form .el-input__inner {
            font-size: 14px;
            height: 42px;
        }
        .login-form .el-form-item {
            margin-bottom: 22px;
        }
        .submit-btn {
            width: 100%;
            height: 46px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            margin-top: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            letter-spacing: 0.1em;
            transition: all 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102,126,234,0.35);
        }
        .login-footer {
            margin-top: 32px;
            font-size: 12px;
            color: #c0c4cc;
        }

        /* ---- 响应式 ---- */
        @media (max-width: 900px) {
            .brand-panel { display: none; }
            .login-panel { width: 100%; min-width: auto; }
        }
    </style>
</head>
<body>

<!-- 左侧品牌 -->
<div class="brand-panel">
    <div class="brand-logo">✨</div>
    <div class="brand-title">
        AI <span>时尚视觉</span><br>设计平台
    </div>
    <div class="brand-desc">
        融合 AI 生成与专业时尚审美，为跨境电商女装提供一站式视觉解决方案
    </div>
    <div class="brand-features">
        <div class="brand-feat">
            <div class="brand-feat-icon">🎨</div>
            <div class="brand-feat-text">智能换色</div>
        </div>
        <div class="brand-feat">
            <div class="brand-feat-icon">🌄</div>
            <div class="brand-feat-text">场景生成</div>
        </div>
        <div class="brand-feat">
            <div class="brand-feat-icon">👤</div>
            <div class="brand-feat-text">AI 模特</div>
        </div>
        <div class="brand-feat">
            <div class="brand-feat-icon">🎬</div>
            <div class="brand-feat-text">视频制作</div>
        </div>
    </div>
</div>

<!-- 右侧登录 -->
<div class="login-panel">
    <div id="app">
        <div class="login-header">
            <h1>欢迎回来</h1>
            <p>请登录您的账户以继续</p>
        </div>
        <el-form :model="form" :rules="rules" ref="loginFormRef" @keyup.enter="handleLogin" class="login-form">
            <el-form-item prop="username">
                <el-input v-model="form.username" placeholder="请输入账号" size="large" prefix-icon="User" :disabled="loading" clearable/>
            </el-form-item>
            <el-form-item prop="password">
                <el-input v-model="form.password" type="password" placeholder="请输入密码" size="large" prefix-icon="Lock" show-password :disabled="loading"/>
            </el-form-item>
            <el-button type="primary" class="submit-btn" :loading="loading" @click="handleLogin">
                {{ loading ? '登录中...' : '登 录' }}
            </el-button>
        </el-form>
        <div class="login-footer">AI 时尚视觉设计平台 · 内部管理系统</div>
    </div>
</div>

<script>
    const { createApp, reactive, ref } = Vue;

    const app = createApp({
        setup() {
            const loginFormRef = ref(null);
            const form = reactive({ username: '', password: '' });
            const loading = ref(false);

            const rules = reactive({
                username: [{ required: true, message: '请输入账号', trigger: 'blur' }],
                password: [{ required: true, message: '请输入密码', trigger: 'blur' }]
            });

            /** 点击登录 → 直接校验账号密码 */
            const handleLogin = () => {
                if (!loginFormRef.value) return;
                loginFormRef.value.validate((valid) => {
                    if (!valid) return;
                    doLogin();
                });
            };

            const doLogin = async () => {
                loading.value = true;
                try {
                    const res = await axios.post('/api/auth/login', {
                        username: form.username,
                        password: form.password
                    });
                    if (res.data.success) {
                        localStorage.setItem("user_token", res.data.data.token);
                        localStorage.setItem("user_name", res.data.data.realName);
                        localStorage.setItem("shop_name", res.data.data.shopName);
                        ElementPlus.ElMessage.success("登录成功！即将跳转...");
                        setTimeout(() => window.location.href = 'index.html', 1000);
                    } else {
                        ElementPlus.ElMessage.error(res.data.message || "登录失败");
                    }
                } catch (e) {
                    ElementPlus.ElMessage.error(e.response?.data?.message || "网络或服务异常，请检查服务是否启动");
                } finally {
                    loading.value = false;
                }
            };

            return { loginFormRef, form, rules, loading, handleLogin };
        }
    });

    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
        app.component(key, component);
    }
    app.use(ElementPlus).mount('#app');
</script>
</body>
</html>
