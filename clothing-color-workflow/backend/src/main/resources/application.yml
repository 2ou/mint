server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://<MYSQL_HOST>:3306/<MYSQL_DB>?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: <MYSQL_USERNAME>
    password: <MYSQL_PASSWORD>
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  local-save-root: D:/AiResult
  oss:
    endpoint: https://oss-cn-shenzhen.aliyuncs.com
    region: cn-shenzhen
    access-key-id: <OSS_ACCESS_KEY_ID>
    access-key-secret: <OSS_ACCESS_KEY_SECRET>
    input-bucket: dify-img-upload
    result-bucket: dify-img-my
    input-public-host: https://dify-img-upload.oss-cn-shenzhen.aliyuncs.com
    result-public-host: https://dify-img-my.oss-cn-shenzhen.aliyuncs.com
  kie:
    base-url: https://<KIE_HOST>
    api-key: <KIE_API_KEY>
    model: nano-banana-2
